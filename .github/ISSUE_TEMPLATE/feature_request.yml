name: 💡 Feature request / skill improvement
description: Suggest a new creator-* skill, or an improvement to an existing one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! Please describe what you'd like and why.
  - type: dropdown
    id: kind
    attributes:
      label: Type of request
      options:
        - Improve an existing skill
        - Propose a new creator-* skill
        - Pipeline / continuity (cross-skill) improvement
        - Tooling (install scripts, repo structure)
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Related skill (if any)
      options:
        - "Not skill-specific"
        - creator-pipeline-supervisor
        - creator-director
        - creator-screenwriter
        - creator-character-designer
        - creator-production-designer
        - creator-cinematographer
        - creator-storyboard-artist
        - creator-shot-list-designer
        - creator-sound-music-designer
        - creator-prompt-engineer
        - creator-final-cut-editor
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What gap or pain point does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the new skill or change. For a new skill, include its purpose and when it should activate.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, if any.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
